<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none" class="campuspulse-logo-white">
  <!-- CampusPulse Official Vector Logo (White & Yellow for Dark Backgrounds) -->
  <g transform="translate(10, 5)">
    <g transform="scale(0.9)">
      <!-- Graduation Cap -->
      <path d="M 50 8 L 88 23 L 50 38 L 12 23 Z" fill="#FFFFFF" />
      <path d="M 28 29.5 L 28 38 C 28 46 72 46 72 38 L 72 29.5 C 64 34 36 34 28 29.5 Z" fill="#FFFFFF" />
      <!-- Golden Yellow Cap Rim -->
      <path d="M 30 31 C 42 35 58 35 70 31 L 70 34 C 58 38 42 38 30 34 Z" fill="#FEB703" />
      <!-- Tassel Drop -->
      <path d="M 50 23 L 20 28 L 19 40" stroke="#FEB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="19" cy="41" r="2.5" fill="#FEB703" />

      <!-- Infinity / CP Loops -->
      <path d="M 50 58 C 50 46 36 44 26 44 C 14 44 6 52 6 63 C 6 74 15 82 27 82 C 38 82 48 74 50 63" 
            stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" fill="none" />
      
      <path d="M 50 58 C 50 46 64 44 74 44 C 86 44 94 52 94 63 C 94 74 85 82 73 82 C 62 82 52 74 50 63" 
            stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" fill="none" />
      <!-- P Tail Descender -->
      <path d="M 47 62 L 47 88 C 47 92 53 92 53 88 L 53 62" fill="#FFFFFF" />

      <!-- Golden Heartbeat / Pulse Wave -->
      <path d="M 12 63 L 42 63 L 47 48 L 53 76 L 60 52 L 66 69 L 71 63 L 88 63" 
            stroke="#FEB703" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(108, 22)">
    <text x="0" y="32" font-family="'Inter', 'Montserrat', system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">CAMPUS <tspan fill="#FEB703">PULSE</tspan></text>
    <text x="2" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.8">DISCOVER. PARTICIPATE. ACHIEVE.</text>
  </g>
</svg>
