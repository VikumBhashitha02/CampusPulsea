# ==============================================================================
# CampusPulse — Local Development Database Service
# ==============================================================================
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: campuspulse-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuspulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuspulse}
      POSTGRES_DB: ${POSTGRES_DB:-campuspulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuspulse} -d ${POSTGRES_DB:-campuspulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: campuspulse_postgres_data
